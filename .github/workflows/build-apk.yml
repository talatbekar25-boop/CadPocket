name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: DXF dosyasini hazirla
        run: |
          rm -f CadPocket/app/src/main/res/raw/ornek.dxf
          mkdir -p CadPocket/app/src/main/assets
          cp CadPocket/sample/ornek.dxf CadPocket/app/src/main/assets/ornek.dxf
          test -f CadPocket/app/src/main/assets/ornek.dxf

      - name: APK olustur
        working-directory: CadPocket
        run: gradle clean assembleDebug --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: CadPocket-v3-duzeltilmis-apk
          path: CadPocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
